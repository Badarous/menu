  .orne { display:block; width:86px; height:12px; margin:2px 0 14px; color:var(--accent); }
  .orne path { stroke-dasharray:120; stroke-dashoffset:120; transition:stroke-dashoffset 1.1s ease .1s; }

  .plat { padding:13px 0; border-bottom:1px dashed var(--ligne); opacity:0; transform:translateY(12px); transition:opacity .55s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
  .vu .plat { opacity:1; transform:none; }

  .formules { display:grid; gap:12px; }
  .formule { position:relative; background:var(--carte); border:1px solid var(--ligne); border-radius:16px; padding:18px 18px 16px; box-shadow:0 1px 0 rgba(0,0,0,.03), 0 12px 24px -20px rgba(0,0,0,.35); opacity:0; transform:translateY(14px) scale(.98); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }

  .formule p { margin:6px 0 0; color:var(--doux); font-size:14px; }
  .formule.ph { padding-top:0; overflow:hidden; }
  .formule.ph::before { display:none; }
  .formule.ph img { display:block; width:calc(100% + 36px); margin:0 -18px 14px; aspect-ratio:4/3; object-fit:cover; transform:scale(1.06); transition:transform 1.4s cubic-bezier(.2,.7,.2,1); }

  .flottant svg { width:20px; height:20px; }

  @media (prefers-reduced-motion: reduce) {

    {ad:{fr:"Salade de fruits", en:"Fruit salad"}, d:{fr:"", en:""}, p:"500", t:[]},
    {ad:{fr:"Pastèque", en:"Watermelon"}, d:{fr:"", en:""}, p:"500", t:[]},
    {ad:{fr:"Mangues", en:"Mangoes"}, d:{fr:"", en:""}, p:"500 à 1.000", t:[]}
  ]}
];
const H0 = null, H1 = null;
const ORNE = '<svg class="orne" viewBox="0 0 86 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 7c9-6 15 4 24-1s12-5 19 0 13 4 20-1 11-3 19 1"/></svg>';
const LANGS = ["fr","en"];
const DEVISE = " F";
let L = LANGS[0];
try { const s = localStorage.getItem("lng"); if (s && LANGS.includes(s)) L = s; } catch (e) {}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tx = o => (o && (o[L] || o[LANGS[0]])) || "";

function dessine() {
  const m = document.getElementById("menu");
  m.innerHTML = MENU.map((c, i) => {
    const formules = c.plats.length && c.plats.every(p => tx(p.d)) && (i === 0 || c.plats.some(p => p.img));
    const corps = formules
      ? '<div class="formules">' + c.plats.map((p, k) => `<div class="formule${p.img ? " ph" : ""}" style="transition-delay:${k*90}ms">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : ""}<div class="haut"><b>${esc(tx(p.ad))}</b><span class="prix">${p.p ? esc(p.p) + DEVISE : ""}</span></div><p>${esc(tx(p.d))}</p></div>`).join("") + '</div>'
      : c.plats.map((p, k) => `<div class="plat" style="transition-delay:${Math.min(k,8)*55}ms"><div class="haut"><b>${esc(tx(p.ad))}</b>${p.p ? '<span class="points"></span>' : ""}<span class="prix">${p.p ? esc(p.p) + DEVISE : ""}</span></div>${tx(p.d) ? `<p>${esc(tx(p.d))}</p>` : ""}${(p.t||[]).map(t => T[t] ? `<span class="tag">${esc(tx(T[t]))}</span>` : "").join("")}</div>`).join("");
    return `<section id="${c.id}"><h2>${esc(tx(c.ad))}</h2>${ORNE}${corps}</section>`;
  }).join("");
  const cats = document.getElementById("cats");
  cats.querySelectorAll("a").forEach(a => a.remove());
  MENU.forEach(c => { const a = document.createElement("a"); a.href = "#" + c.id; a.textContent = tx(c.ad); cats.appendChild(a); });
  document.querySelectorAll("[data-t]").forEach(e => { const v = T[e.dataset.t]; if (v) e.textContent = tx(v); });
  document.documentElement.lang = L;
  etat(); observe(); placePastille(); setTimeout(placeTrait, 30);
}

function etat() {
  const d = new Date(new Date().toLocaleString("en-US", {timeZone:"Europe/Istanbul"}));
  const h = d.getHours() + d.getMinutes() / 60, ouvert = h >= H0 && h < H1;
  const e = document.getElementById("etat");
  if (!e || H0 === null) return;
  e.classList.toggle("ferme", !ouvert);
  e.querySelector("span").textContent = tx(ouvert ? T.acik : T.kapali);
}

let obs;
function observe() {
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("vu"); obs.unobserve(x.target); } }), {rootMargin:"0px 0px -12% 0px"});
  document.querySelectorAll("section").forEach(s => obs.observe(s));
}

function placePastille() {
  const b = document.querySelector(`#langues button[data-l="${L}"]`), p = document.getElementById("pastille");
  document.querySelectorAll("#langues button").forEach(x => x.classList.toggle("actif", x === b));
  p.style.left = b.offsetLeft + "px"; p.style.width = b.offsetWidth + "px";
}

let actuelle = null;
function placeTrait() {
  const secs = [...document.querySelectorAll("section")];
  let id = secs.length ? secs[0].id : null;
  for (const s of secs) if (s.getBoundingClientRect().top < 140) id = s.id;
  const a = document.querySelector(`#cats a[href="#${id}"]`), t = document.getElementById("trait");
  if (!a) return;
  document.querySelectorAll("#cats a").forEach(x => x.classList.toggle("ici", x === a));
  t.style.left = a.offsetLeft + "px"; t.style.width = a.offsetWidth + "px";
  if (id !== actuelle) { actuelle = id; const c = document.getElementById("cats"); c.scrollTo({left: a.offsetLeft - c.clientWidth / 2 + a.offsetWidth / 2, behavior:"smooth"}); }
}

document.querySelectorAll("#langues button").forEach(b => b.onclick = () => {
  if (b.dataset.l === L) return;
  L = b.dataset.l; try { localStorage.setItem("lng", L); } catch (e) {}
  placePastille();
  const m = document.getElementById("menu"); m.classList.add("change");
  setTimeout(() => { dessine(); document.querySelectorAll("section").forEach(s => s.classList.add("vu")); m.classList.remove("change"); }, 180);
});

const photo = document.getElementById("photo"), barre = document.getElementById("barre"), flot = document.getElementById("flottant");
const doux = matchMedia("(prefers-reduced-motion: reduce)").matches;
let tic = false;
addEventListener("scroll", () => {
  if (tic) return; tic = true;
  requestAnimationFrame(() => {
    const y = scrollY;
    if (!doux) document.documentElement.style.setProperty('--y', y);
    if (photo && !doux && y < 700) photo.style.transform = `translateY(${y * 0.28}px) scale(1)`;
    barre.classList.toggle("colle", barre.getBoundingClientRect().top <= 0);
    flot.classList.toggle("montre", y > 520);
    placeTrait(); tic = false;
  });
}, {passive:true});
addEventListener("resize", () => { placePastille(); placeTrait(); });

dessine();
const go = () => requestAnimationFrame(() => document.body.classList.add("pret"));
if (!photo || photo.complete) go(); else { photo.onload = go; photo.onerror = go; }
setInterval(etat, 60000);
</script>
</body>
</html>
